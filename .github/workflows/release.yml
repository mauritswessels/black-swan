# Publishing a new version of the Mac app.
#
# On every push to main this looks at the version in package.json. If GitHub has no release
# for it yet, it builds Black Swan for Apple Silicon and Intel Macs, signs the update with the
# key in the TAURI_SIGNING_PRIVATE_KEY secret, and publishes a release with the .dmg (to install
# by hand) and latest.json (which every installed copy reads to find the update).
# The release notes are the version's section of CHANGELOG.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Is this a new version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Version $VERSION is already released: nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION is new: building it."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and publish the Mac app
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: The signing key is set up
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The repository secret TAURI_SIGNING_PRIVATE_KEY is missing, so updates cannot be signed. See 'Releasing a new version' in README.md."
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          {
            echo 'body<<NOTES_END'
            node scripts/release-notes.mjs "${{ needs.version.outputs.version }}"
            echo 'NOTES_END'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci --no-fund --no-audit
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Black Swan __VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
